name: Daily Horizon AI Agent Human Impact Briefing

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai. GitHub may delay scheduled jobs slightly.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Use GitHub Actions configuration
        shell: bash
        run: cp data/config.github.json data/config.json

      - name: Generate briefing and send WeCom
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24 --log-level INFO

      - name: Set report date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Horizon briefing: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
